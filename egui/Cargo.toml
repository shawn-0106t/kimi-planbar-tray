[package]
name = "kimi-planbar-tray-egui"
version = "0.1.0"
edition = "2021"
description = "Phase 0 feasibility spike for an egui edition of Kimi Planbar Tray"
publish = false

[dependencies]
# Pinned exact versions: the egui viewport API churns between releases, so a
# spike that compiles today must keep compiling while later phases reuse it.
eframe = { version = "=0.36.2", default-features = true, features = ["glow", "wgpu"] }
egui = "0.36.2"
tray-icon = "=0.26.1"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }

[profile.release]
opt-level = 2
