name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  # No paths-ignore on pull_request: both CI jobs are required checks with
  # enforce_admins, so a docs-only PR that skips CI could never merge
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # keep in-progress runs on main alive for bisect integrity; cancel superseded PR runs
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege for both jobs (CodeQL actions/missing-workflow-permissions);
# npm/rust caches use the Actions Runtime Token, unaffected by GITHUB_TOKEN scope
permissions:
  contents: read

jobs:
  # Second line of defense for secrets: the local pre-commit gitleaks scan can
  # be bypassed (--no-verify, other machines, web edits), so scan the full
  # commit history here
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          # gitleaks-action@v3 needs no license secret on personal public repos
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pin below 8.30.x: that line has a detection regression (gitleaks
          # #2170: rules load but never match). Drop the pin once verified fixed.
          GITLEAKS_VERSION: 8.29.1

  build-and-test:
    name: Build & test (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: rust/package-lock.json

      - name: Setup Rust (stable)
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          # the action denies cargo warnings by default; this is a build check, not a lint gate
          build-warnings: warn
          cache: false

      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            rust/src-tauri
            egui

      - name: Cargo fmt
        working-directory: rust/src-tauri
        run: cargo fmt --check

      - name: Cargo clippy
        working-directory: rust/src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings

      # Frontend first so rust/dist/ is fresh; the debug cargo build does not
      # consume it (devUrl is used), but a release build would
      - name: Install frontend dependencies
        working-directory: rust
        run: npm ci

      - name: Frontend type-check
        working-directory: rust
        run: npx tsc --noEmit

      - name: Frontend build
        working-directory: rust
        run: npm run build

      - name: Cargo build
        working-directory: rust/src-tauri
        run: cargo build --locked

      - name: Cargo test
        working-directory: rust/src-tauri
        run: cargo test --locked

      # egui edition (experimental, test-only): same compile-level gate on its
      # own crate; the runtime --test-* self-checks stay local-only, same as
      # rust/ (no credentials or interactive desktop on hosted runners)
      - name: egui Cargo fmt
        working-directory: egui
        run: cargo fmt --check

      - name: egui Cargo clippy
        working-directory: egui
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: egui Cargo build
        working-directory: egui
        run: cargo build --locked

      - name: egui Cargo test
        working-directory: egui
        run: cargo test --locked

      # WPF edition (maintained again, ships via Releases): compile-level gate
      # only — the runtime --test-* self-checks need local Kimi Code credentials
      # and an interactive desktop, same boundary as rust/ and egui/
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x

      - name: WPF build
        run: dotnet build wpf -c Release
