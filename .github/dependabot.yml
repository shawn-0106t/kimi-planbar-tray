# Dependabot: weekly; minor+patch bump PRs are grouped into one per ecosystem
# to cut noise, major bumps open individual PRs for case-by-case evaluation.
version: 2

updates:
  - package-ecosystem: cargo
    directory: /rust/src-tauri
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # egui edition (experimental, test-only): same weekly cargo cadence so its
  # lockfile stays fresh alongside the CI gate added for it.
  - package-ecosystem: cargo
    directory: /egui
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: npm
    directory: /rust
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
