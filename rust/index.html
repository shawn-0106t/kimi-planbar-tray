<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kimi Planbar Tray</title>
  </head>
  <body>
    <div id="root">
      <div class="content">
        <!-- Header (SPEC 12.1) -->
        <div class="header">
          <img id="logo" class="logo" alt="" />
          <span class="title">Kimi Planbar Tray</span>
          <span id="last-updated" class="last-updated"></span>
        </div>

        <!-- Usage cards (SPEC 12.2) -->
        <div class="cards">
          <div class="card card-left">
            <div class="card-title">Weekly usage</div>
            <div class="pct" id="week-pct">--</div>
            <div class="bar"><div class="bar-fill" id="week-fill"></div></div>
            <div class="reset" id="week-reset"></div>
          </div>
          <div class="card card-right">
            <div class="card-title">5-hour usage</div>
            <div class="pct" id="five-pct">--</div>
            <div class="bar"><div class="bar-fill" id="five-fill"></div></div>
            <div class="reset" id="five-reset"></div>
          </div>
        </div>

        <!-- Extra Usage card (SPEC 12.4) -->
        <div class="card extra">
          <div class="extra-row">
            <span class="card-title">Extra Usage</span>
            <span class="extra-balance" id="extra-balance">--</span>
          </div>
          <div class="extra-monthly" id="extra-monthly" hidden>
            <div class="bar"><div class="bar-fill" id="extra-fill"></div></div>
            <div class="extra-monthly-text" id="extra-monthly-text"></div>
          </div>
        </div>

        <!-- Version row (SPEC 12.6) -->
        <div class="card version" id="version-row" title="View Kimi Code releases">
          <span class="version-label">Kimi Code CLI</span>
          <span class="version-right">
            <span class="cli-version" id="cli-version">--</span>
            <span class="badge" id="badge" hidden>Update available</span>
          </span>
        </div>
