<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kimi Planbar Tray 设置</title>
  </head>
  <body>
    <div id="root">
      <div class="content">
        <!-- Custom title bar, draggable (SPEC 4.1) -->
        <div class="titlebar" id="titlebar">
          <img id="logo" class="logo" alt="" />
          <span class="title">Kimi Planbar Tray 设置</span>
          <button class="chrome-close" id="btn-close">&#10005;</button>
        </div>

        <!-- Settings items (SPEC 4.2) -->
        <div class="body">
          <div class="section-title">主题</div>
          <label class="radio" style="margin-top: 10px">
            <input type="radio" name="theme" value="system" />
            <span class="circle"></span>
            <span class="radio-text">跟随系统</span>
          </label>
          <label class="radio" style="margin-top: 8px">
            <input type="radio" name="theme" value="light" />
            <span class="circle"></span>
            <span class="radio-text">月之亮面</span>
          </label>
          <label class="radio" style="margin-top: 8px">
            <input type="radio" name="theme" value="dark" />
            <span class="circle"></span>
            <span class="radio-text">月之暗面</span>
          </label>

          <div class="section-title" style="margin-top: 20px">刷新间隔</div>
          <div class="pills">
            <label class="pill">
              <input type="radio" name="interval" value="1" />
              <span class="pill-text">1 分钟</span>
            </label>
            <label class="pill">
              <input type="radio" name="interval" value="5" />
              <span class="pill-text">5 分钟</span>
            </label>
            <label class="pill">
              <input type="radio" name="interval" value="10" />
              <span class="pill-text">10 分钟</span>
            </label>
            <label class="pill">
              <input type="radio" name="interval" value="30" />
              <span class="pill-text">30 分钟</span>
            </label>
          </div>

          <label class="checkbox" style="margin-top: 22px">
            <input type="checkbox" id="autostart" />
            <span class="box"></span>
            <span class="checkbox-text">开机自动启动</span>
          </label>

          <button class="btn" id="btn-save" style="margin-top: 26px">保存</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/settings.ts"></script>
  </body>
</html>
